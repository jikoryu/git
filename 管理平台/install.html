<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安装 — 商品价格走势查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f6fa;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:#fff;border-radius:16px;padding:40px 32px;max-width:560px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center}
.card h1{font-size:24px;font-weight:800;margin-bottom:8px}
.card .sub{font-size:14px;color:#999;margin-bottom:32px}
.option{background:#f9fafb;border:2px solid #e8e8e8;border-radius:14px;padding:24px;margin-bottom:16px;text-align:left;transition:all .2s}
.option:hover{border-color:#4f46e5}
.option .badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-bottom:8px}
.option .badge.recommend{background:#eef2ff;color:#4f46e5}
.option .badge.fast{background:#ecfdf5;color:#059669}
.option h3{font-size:16px;font-weight:600;margin-bottom:4px}
.option p{font-size:13px;color:#666;line-height:1.6}
.option .action-btn{display:inline-block;margin-top:12px;padding:10px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;border:none;transition:all .2s}
.action-btn.purple{background:#4f46e5;color:#fff}
.action-btn.purple:hover{background:#4338ca}
.action-btn.green{background:#10b981;color:#fff}
.action-btn.green:hover{background:#059669}
.steps{margin-top:10px;padding-left:18px}
.steps li{font-size:12px;color:#888;line-height:1.8}
</style>
</head>
<body>
<div class="card">
  <h1>📉 安装价格走势工具</h1>
  <p class="sub">选一种方式，30秒搞定</p>

  <!-- 方式一：书签（推荐，无需安装任何扩展） -->
  <div class="option">
    <span class="badge recommend">⭐ 推荐 · 无需扩展</span>
    <h3>方式一：拖拽书签</h3>
    <p>把下面的按钮拖到浏览器<strong>书签栏</strong>。逛京东/淘宝/拼多多时点一下即可查看价格走势。</p>
    <a class="action-btn purple" id="bookmarklet" href="javascript:void(0)" draggable="false">
      📉 查看价格走势
    </a>
    <ul class="steps">
      <li>确保书签栏可见（Chrome: Ctrl+Shift+B）</li>
      <li>把按钮拖到书签栏上</li>
      <li>打开任意电商商品页 → 点书签</li>
    </ul>
  </div>

  <!-- 方式二：油猴脚本（更自动化） -->
  <div class="option">
    <span class="badge fast">🤖 自动注入</span>
    <h3>方式二：油猴脚本（自动显示按钮）</h3>
    <p>安装后商品页<strong>自动出现</strong>悬浮按钮，无需手动操作。</p>
    <a class="action-btn green" href="price-tracker.user.js" target="_blank">
      安装脚本
    </a>
    <ul class="steps">
      <li>需先安装 <a href="https://www.tampermonkey.net/" target="_blank">Tampermonkey</a> 扩展</li>
      <li>点击上方按钮 → Tampermonkey 自动识别 → 确认安装</li>
    </ul>
  </div>

  <p style="margin-top:20px;font-size:12px;color:#bbb">安装后打开 <a href="http://localhost:8888/?url=https://item.jd.com/100012043978.html" style="color:#4f46e5">演示页面</a> 查看效果</p>
</div>

<script>
(function(){
  var tool = window.location.origin + window.location.pathname.replace('install.html','index.html');
  var code = "javascript:(function(){var u=location.href;var t='" + tool + "';if(/jd\\.com|taobao\\.com|tmall\\.com|pinduoduo\\.com|yangkeduo\\.com/.test(u)){window.open(t+'?url='+encodeURIComponent(u),'_blank');}else{alert('请在京东\\u3001淘宝/天猫\\u3001拼多多的商品页面使用此工具');}})()";
  var btn = document.getElementById('bookmarklet');
  btn.href = code;
  btn.setAttribute('draggable','true');
})();
</script>
</body>
</html>
