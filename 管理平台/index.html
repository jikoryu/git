<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>价格走势</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f6fa;color:#333;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:24px 20px 60px}
/* 商品信息 */
.product-hero{display:flex;gap:20px;background:#fff;border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.04);align-items:center}
.product-hero .img-box{width:140px;height:140px;border-radius:10px;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:72px;flex-shrink:0}
.product-hero .info{flex:1;min-width:0}
.product-hero h1{font-size:18px;font-weight:600;line-height:1.5;margin-bottom:6px}
.product-hero .meta{font-size:13px;color:#999;margin-bottom:8px}
.product-hero .meta .plat-tag{display:inline-block;color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;margin-right:8px}
.product-hero .price-current{font-size:32px;font-weight:800;color:#e53935}
.product-hero .source-link{font-size:12px;color:#999;margin-top:4px}
.product-hero .source-link a{color:#4f46e5;text-decoration:none}
.product-hero .source-link a:hover{text-decoration:underline}
/* 概览卡 */
.price-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.price-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.price-card .label{font-size:11px;color:#999;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.price-card .value{font-size:22px;font-weight:700}
.price-card .change{font-size:11px;margin-top:4px}
/* 图表 */
.chart-box{background:#fff;border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.chart-box h2{font-size:15px;font-weight:600;margin-bottom:16px}
.chart-wrap{position:relative;height:320px}
/* 表格 */
.table-box{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.table-box h2{font-size:15px;font-weight:600;padding:18px 20px;border-bottom:1px solid #f0f0f0}
.table-box table{width:100%;border-collapse:collapse}
.table-box th{padding:10px 20px;font-size:11px;color:#999;font-weight:500;text-align:left;background:#fafafa}
.table-box td{padding:10px 20px;border-bottom:1px solid #f5f5f5;font-size:13px}
.table-box .price-cell{font-weight:600}
.tag{display:inline-block;padding:2px 6px;border-radius:10px;font-size:11px;font-weight:600}
.tag.down{background:#ffebee;color:#c62828}
.tag.up{background:#e8f5e9;color:#2e7d32}
/* 错误 */
.error-box{max-width:500px;margin:80px auto;background:#fff;border-radius:14px;padding:40px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.error-box .icon{font-size:48px;margin-bottom:12px}
.error-box p{color:#999;margin-bottom:16px;line-height:1.6}
@media(max-width:640px){
  .price-cards{grid-template-columns:repeat(2,1fr)}
  .product-hero{flex-direction:column;align-items:center;text-align:center}
}
</style>
</head>
<body>
<div class="container" id="content"></div>

<script>
// ═══════════════════════════════════════
// 平台检测 & 商品信息提取
// ═══════════════════════════════════════
const PLATFORM_CONFIG = {
  jd:      { name:'京东',     color:'#E2231A', domain:/jd\.com/ },
  taobao:  { name:'淘宝/天猫', color:'#FF5000', domain:/taobao\.com|tmall\.com/ },
  pdd:     { name:'拼多多',    color:'#E02E24', domain:/pinduoduo\.com|yangkeduo\.com/ },
};

function detectPlatform(url) {
  for (const [key, cfg] of Object.entries(PLATFORM_CONFIG)) {
    if (cfg.domain.test(url)) return key;
  }
  return null;
}

function extractProductId(url, platform) {
  if (platform === 'jd') {
    const m = url.match(/\/(\d{6,})\.html/) || url.match(/[?&]sku[=](\d+)/);
    return m ? m[1] : null;
  }
  if (platform === 'taobao') {
    const m = url.match(/[?&]id[=](\d+)/);
    return m ? m[1] : null;
  }
  if (platform === 'pdd') {
    const m = url.match(/goods_id[=](\d+)/) || url.match(/goodsId[=](\d+)/);
    return m ? m[1] : null;
  }
  return null;
}

// ═══════════════════════════════════════
// 模拟价格历史（真实场景接入平台API）
// ═══════════════════════════════════════
function generatePriceHistory(basePrice, days) {
  const data = [];
  let price = basePrice;
  const now = new Date();
  for (let i = days; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const drift = (Math.random() - 0.48) * 0.05 * price;
    const promoDay = (i > 3 && i % (11 + Math.floor(Math.random() * 7)) === 0);
    const promoDrop = promoDay ? -(Math.random() * 0.1 * price) : 0;
    price = Math.max(basePrice * 0.65, Math.min(basePrice * 1.35, price + drift + promoDrop));
    data.push({ date: d.toISOString().split('T')[0], price: Math.round(price * 100) / 100 });
  }
  return data;
}

// ═══════════════════════════════════════
// 商品模板库
// ═══════════════════════════════════════
const PRODUCT_TEMPLATES = {
  'jd:100012043978':   { title:'iPhone 16 Pro Max 256GB 原色钛金属',            shop:'Apple 京东自营旗舰店',   icon:'📱', basePrice:9499 },
  'jd:100066471892':   { title:'MacBook Pro 14英寸 M4 Pro 24GB/512GB',         shop:'Apple 京东自营旗舰店',   icon:'💻', basePrice:14999 },
  'jd:100090276589':   { title:'戴森 V15 Detect 无绳吸尘器 2024款',             shop:'戴森京东自营旗舰店',      icon:'🧹', basePrice:4490 },
  'jd:100012345678':   { title:'三星 Galaxy S24 Ultra 12GB+256GB 钛灰',        shop:'三星京东自营旗舰店',      icon:'📱', basePrice:8999 },
  'jd:100023456789':   { title:'小米14 Ultra 16GB+512GB 龙晶蓝',               shop:'小米京东自营旗舰店',      icon:'📱', basePrice:5999 },
  'jd:100044444444':   { title:'AirPods Pro 第二代 MagSafe充电盒版',            shop:'Apple 京东自营旗舰店',   icon:'🎧', basePrice:1699 },
  'jd:100055555555':   { title:'联想拯救者 Y9000P 2024 i9-14900HX RTX4060',    shop:'联想京东自营旗舰店',      icon:'💻', basePrice:8999 },
  'taobao:738000000000': { title:'华为 Mate 60 Pro 12GB+512GB 雅丹黑',          shop:'华为官方旗舰店',          icon:'📱', basePrice:6999 },
  'taobao:739000000000': { title:'索尼 PlayStation 5 Slim 光驱版 国行',         shop:'PlayStation官方旗舰店',   icon:'🎮', basePrice:3299 },
  'taobao:740000000000': { title:'Nike Air Jordan 1 Retro High OG',            shop:'Nike官方旗舰店',          icon:'👟', basePrice:1299 },
  'taobao:741000000000': { title:'大疆 DJI Mini 4 Pro 畅飞套装',                shop:'大疆官方旗舰店',          icon:'🚁', basePrice:4788 },
  'taobao:742000000000': { title:'茅台 飞天53度 500ml 酱香型白酒',               shop:'茅台官方旗舰店',          icon:'🍶', basePrice:2699 },
  'pdd:3000000001':     { title:'茅台 飞天53度 500ml 酱香型白酒',               shop:'酒仙网专营店',            icon:'🍶', basePrice:2599 },
  'pdd:3000000002':     { title:'Switch OLED 马力欧红蓝 续航版',                shop:'电玩地带',               icon:'🎮', basePrice:1729 },
  'pdd:3000000003':     { title:'乐高 机械组 兰博基尼 Sián FKP 37',            shop:'乐高专营店',             icon:'🏎️', basePrice:2499 },
};

function getDefaultTemplate(url, platform) {
  const icons = ['📦','🛍️','🏷️','🔥','💎','⭐','🎯','✨'];
  const titles = ['精选热卖商品','人气爆款单品','旗舰店正品好物','当季主推商品','口碑畅销单品'];
  const shops = ['品牌官方旗舰店','自营旗舰店','品牌专营店','官方专卖店'];
  return {
    title: titles[Math.floor(Math.random()*titles.length)],
    shop: shops[Math.floor(Math.random()*shops.length)],
    icon: icons[Math.floor(Math.random()*icons.length)],
    basePrice: 99 + Math.floor(Math.random()*5000),
  };
}

// ═══════════════════════════════════════
// 渲染价格走势页面
// ═══════════════════════════════════════
function render(platform, productUrl, pid, tpl, history) {
  const cfg = PLATFORM_CONFIG[platform];
  const cur = history[history.length-1].price;
  const lo  = Math.min(...history.map(h=>h.price));
  const hi  = Math.max(...history.map(h=>h.price));
  const pct = ((cur - history[0].price) / history[0].price * 100);
  const amp = ((hi - lo) / lo * 100);

  document.title = `${tpl.title} - 价格走势`;

  document.getElementById('content').innerHTML = `
    <div class="product-hero">
      <div class="img-box">${tpl.icon}</div>
      <div class="info">
        <h1>${tpl.title}</h1>
        <div class="meta">
          <span class="plat-tag" style="background:${cfg.color}">${cfg.name}</span>
          ${tpl.shop}
        </div>
        <div class="price-current">¥${cur.toFixed(2)}</div>
        <div class="source-link">
          <a href="${productUrl}" target="_blank">🔗 查看商品原页面 →</a>
        </div>
      </div>
    </div>

    <div class="price-cards">
      <div class="price-card">
        <div class="label">当前价格</div>
        <div class="value" style="color:#e53935">¥${cur.toFixed(2)}</div>
        <div class="change" style="color:${pct<0?'#2e7d32':'#e53935'}">${pct>=0?'↑':'↓'} ${Math.abs(pct).toFixed(1)}%（30天）</div>
      </div>
      <div class="price-card">
        <div class="label">30天最低</div>
        <div class="value" style="color:#2e7d32">¥${lo.toFixed(2)}</div>
        <div class="change" style="color:#2e7d32">比现价低 ¥${(cur-lo).toFixed(2)}</div>
      </div>
      <div class="price-card">
        <div class="label">30天最高</div>
        <div class="value" style="color:#333">¥${hi.toFixed(2)}</div>
        <div class="change" style="color:#e53935">比现价高 ¥${(hi-cur).toFixed(2)}</div>
      </div>
      <div class="price-card">
        <div class="label">价格波动</div>
        <div class="value" style="color:#4f46e5">¥${(hi-lo).toFixed(2)}</div>
        <div class="change">振幅 ${amp.toFixed(1)}%</div>
      </div>
    </div>

    <div class="chart-box">
      <h2>📊 ${cfg.name}平台 · 近30天价格走势</h2>
      <div class="chart-wrap"><canvas id="priceChart"></canvas></div>
    </div>

    <div class="table-box">
      <h2>📋 每日价格明细</h2>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>日期</th><th>价格</th><th>变化</th><th>备注</th></tr></thead>
        <tbody>${history.slice().reverse().map((x,i,a)=>{
          const prev=a[i+1]; let ch='-';
          if(prev){const d=x.price-prev.price;
            if(d!==0)ch=`<span class="tag ${d<0?'down':'up'}">${d>0?'+':''}¥${d.toFixed(2)}</span>`;
            else ch='<span style="color:#999">持平</span>';}
          let note='';
          if(x.price===hi) note='📈 最高价';
          else if(x.price===lo) note='📉 最低价';
          return `<tr><td style="color:#999">${x.date}</td><td class="price-cell">¥${x.price.toFixed(2)}</td><td>${ch}</td><td style="color:#999">${note}</td></tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>`;

  setTimeout(drawChart, 100, history);
}

let chart=null;
function drawChart(history){
  const ctx=document.getElementById('priceChart');
  if(!ctx)return;
  if(chart)chart.destroy();
  const lo=Math.min(...history.map(x=>x.price));
  const hi=Math.max(...history.map(x=>x.price));
  chart=new Chart(ctx,{
    type:'line',
    data:{
      labels:history.map(h=>h.date.slice(5)),
      datasets:[{
        data:history.map(h=>h.price),
        borderColor:'#4f46e5',backgroundColor:'rgba(79,70,229,0.06)',
        borderWidth:2.5,fill:true,tension:0.3,
        pointRadius:history.map(h=>h.price===lo||h.price===hi?5:1.5),
        pointBackgroundColor:history.map(h=>h.price===lo?'#2e7d32':h.price===hi?'#e53935':'#4f46e5'),
        pointHoverRadius:6,
      }],
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},
        tooltip:{callbacks:{title:items=>history[items[0].dataIndex].date,label:ctx=>'¥'+ctx.parsed.y.toFixed(2)}}},
      scales:{
        x:{grid:{display:false},ticks:{maxTicksLimit:15,font:{size:10},color:'#999'}},
        y:{grid:{color:'#f0f0f0'},ticks:{font:{size:10},color:'#999',callback:v=>'¥'+v}},
      },
      interaction:{intersect:false,mode:'index'},
    },
  });
}

// ═══════════════════════════════════════
// 入口：从 ?url= 参数读取
// ═══════════════════════════════════════
(function main(){
  const params = new URLSearchParams(window.location.search);
  const productUrl = params.get('url');

  if (!productUrl) {
    document.getElementById('content').innerHTML = `
      <div class="error-box">
        <div class="icon">🔗</div>
        <p>此页面需通过商品链接访问</p>
        <p style="font-size:13px;color:#bbb">在京东/淘宝/拼多多商品页面，<br>点击油猴脚本注入的「📉 查看价格走势」按钮即可</p>
      </div>`;
    return;
  }

  const platform = detectPlatform(productUrl);
  if (!platform) {
    document.getElementById('content').innerHTML = `
      <div class="error-box">
        <div class="icon">⚠️</div>
        <p>未能识别该链接对应的平台</p>
        <p style="font-size:13px;color:#bbb">仅支持京东、淘宝/天猫、拼多多</p>
      </div>`;
    return;
  }

  const pid = extractProductId(productUrl, platform);
  const key = `${platform}:${pid}`;
  const tpl = PRODUCT_TEMPLATES[key] || getDefaultTemplate(productUrl, platform);
  const history = generatePriceHistory(tpl.basePrice, 30);

  render(platform, productUrl, pid, tpl, history);
})();
</script>
</body>
</html>
