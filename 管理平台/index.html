<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>价格走势 — Amazon</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f6fa;color:#333;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:24px 20px 60px}
/* 商品信息 */
.product-hero{display:flex;gap:24px;background:#fff;border-radius:14px;padding:28px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.04);align-items:flex-start}
.product-hero img{width:180px;max-height:180px;object-fit:contain;border-radius:10px;background:#fafafa;flex-shrink:0}
.product-hero .img-placeholder{width:180px;height:180px;border-radius:10px;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:72px;flex-shrink:0}
.product-hero .info{flex:1;min-width:0}
.product-hero h1{font-size:18px;font-weight:600;line-height:1.5;margin-bottom:8px}
.product-hero .meta{font-size:13px;color:#999;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.product-hero .meta .plat-tag{display:inline-block;color:#fff;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600}
.product-hero .meta .source-tag{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600}
.source-tag.client{background:#c8e6c9;color:#1b5e20}
.source-tag.history{background:#e3f2fd;color:#0d47a1}
.product-hero .price-current{font-size:36px;font-weight:800;color:#e53935;margin-bottom:6px}
.product-hero .price-currency{font-size:20px;font-weight:500}
.product-hero .actions{margin-top:8px}
.product-hero .actions a{color:#4f46e5;text-decoration:none;font-size:13px}
.product-hero .actions a:hover{text-decoration:underline}
/* 概览卡 */
.price-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.price-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.price-card .label{font-size:11px;color:#999;margin-bottom:4px;letter-spacing:.5px}
.price-card .value{font-size:22px;font-weight:700}
.price-card .sub{font-size:11px;margin-top:4px;color:#999}
/* 数据采集提示 */
.data-note{background:#fff9c4;border-radius:10px;padding:14px 18px;margin-bottom:20px;font-size:13px;color:#8d6e00;display:flex;align-items:center;gap:10px;line-height:1.6}
.data-note .icon{font-size:20px;flex-shrink:0}
.data-note strong{color:#5d4e00}
/* 图表 */
.chart-box{background:#fff;border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.chart-box h2{font-size:15px;font-weight:600;margin-bottom:16px}
.chart-wrap{position:relative;height:320px}
/* 表格 */
.table-box{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.table-box h2{font-size:15px;font-weight:600;padding:18px 20px;border-bottom:1px solid #f0f0f0}
.table-box table{width:100%;border-collapse:collapse}
.table-box th{padding:10px 20px;font-size:11px;color:#999;font-weight:500;text-align:left;background:#fafafa}
.table-box td{padding:10px 20px;border-bottom:1px solid #f5f5f5;font-size:13px}
.table-box .price-cell{font-weight:600}
.tag{display:inline-block;padding:2px 6px;border-radius:10px;font-size:11px;font-weight:600}
.tag.down{background:#ffebee;color:#c62828}
.tag.up{background:#e8f5e9;color:#2e7d32}
/* 状态 */
.state-box{max-width:500px;margin:80px auto;background:#fff;border-radius:14px;padding:40px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.state-box .icon{font-size:48px;margin-bottom:12px}
.state-box p{color:#666;margin-bottom:8px;line-height:1.6}
.state-box .sub{font-size:13px;color:#999}
.spinner{width:40px;height:40px;border:3px solid #e0e0e0;border-top-color:#4f46e5;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:640px){
  .price-cards{grid-template-columns:repeat(2,1fr)}
  .product-hero{flex-direction:column;align-items:center;text-align:center}
  .product-hero img,.product-hero .img-placeholder{width:120px;height:120px}
}
</style>
</head>
<body>
<div class="container" id="content"></div>

<script>
// ═══════════════════════════════════════
// 平台配置
// ═══════════════════════════════════════
const PLATFORM_CONFIG = {
  amazon:  { name:'Amazon',  color:'#FF9900', domain:/amazon\./ },
};

function detectPlatform(url) {
  for (const [key, cfg] of Object.entries(PLATFORM_CONFIG)) {
    if (cfg.domain.test(url)) return key;
  }
  return null;
}

// ═══════════════════════════════════════
// 价格历史存储（localStorage）
// ═══════════════════════════════════════
function getStoredHistory(productUrl) {
  const key = 'pt_history_' + btoa(productUrl).slice(0, 40);
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

function saveHistoryPoint(productUrl, price, date) {
  const key = 'pt_history_' + btoa(productUrl).slice(0, 40);
  let history = getStoredHistory(productUrl);
  // 避免同一天重复记录
  const today = (date || new Date().toISOString()).split('T')[0];
  const exists = history.some(h => (h.date || h.recorded_at || '').startsWith(today));
  if (!exists) {
    history.push({ date: today, price: parseFloat(price), recorded_at: date || new Date().toISOString() });
    // 保留90天
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 90);
    history = history.filter(h => new Date(h.date) >= cutoff);
    try { localStorage.setItem(key, JSON.stringify(history)); } catch {}
  }
  return history;
}

// ═══════════════════════════════════════
// 渲染
// ═══════════════════════════════════════
function render(platform, productUrl, title, price, image, shop, history) {
  const cfg = PLATFORM_CONFIG[platform];
  const cur = parseFloat(price);
  const count = history.length;

  let lo = cur, hi = cur, pct = 0, amp = 0;
  if (count >= 2) {
    const prices = history.map(h => h.price);
    lo = Math.min(...prices);
    hi = Math.max(...prices);
    const first = prices[0];
    pct = ((cur - first) / first * 100);
    amp = ((hi - lo) / lo * 100);
  }

  const hasEnough = count >= 2;
  document.title = `${title} - 价格走势`;
  const fmt = (n) => '$' + n.toFixed(2);

  let noteHTML = '';
  if (!hasEnough) {
    if (count === 1) {
      noteHTML = `<div class="data-note"><span class="icon">⏳</span><span>这是该商品第 <strong>1</strong> 条价格记录。每次查询都会保存当前真实价格，<strong>历史走势会随查询次数逐步积累</strong>。下次再来看就有对比数据了。</span></div>`;
    } else {
      noteHTML = `<div class="data-note"><span class="icon">⏳</span><span>暂无历史价格数据。首次查询，今日价格已记录。随着使用次数增加，价格走势图将逐步形成。</span></div>`;
    }
  }

  document.getElementById('content').innerHTML = `
    <div class="product-hero">
      ${image && image.startsWith('http')
        ? `<img src="${esc(image)}" alt="${esc(title)}" onerror="this.parentElement.querySelector('.img-placeholder').style.display='flex';this.style.display='none'">
           <div class="img-placeholder" style="display:none">📦</div>`
        : `<div class="img-placeholder">📦</div>`}
      <div class="info">
        <h1>${esc(title)}</h1>
        <div class="meta">
          <span class="plat-tag" style="background:${cfg.color}">${cfg.name}</span>
          ${shop ? `<span>${esc(shop)}</span>` : ''}
          <span class="source-tag client">页面提取</span>
          ${hasEnough ? `<span class="source-tag history">${count}条记录</span>` : ''}
        </div>
        <div class="price-current">$${cur.toFixed(2)}</div>
        <div class="actions">
          <a href="${esc(productUrl)}" target="_blank">🔗 查看商品原页面 →</a>
          &nbsp;&nbsp;
          <a href="javascript:window.close()" style="color:#999">关闭页面</a>
        </div>
      </div>
    </div>

    ${noteHTML}

    <div class="price-cards">
      <div class="price-card">
        <div class="label">当前价格</div>
        <div class="value" style="color:#e53935">${fmt(cur)}</div>
        <div class="sub">${count} 条记录</div>
      </div>
      <div class="price-card">
        <div class="label">最低价</div>
        <div class="value" style="color:${hasEnough?'#2e7d32':'#999'}">${hasEnough ? fmt(lo) : '—'}</div>
        <div class="sub">${hasEnough ? `比现价低 ${fmt(cur-lo)}` : '数据不足'}</div>
      </div>
      <div class="price-card">
        <div class="label">最高价</div>
        <div class="value" style="color:${hasEnough?'#333':'#999'}">${hasEnough ? fmt(hi) : '—'}</div>
        <div class="sub">${hasEnough ? `比现价高 ${fmt(hi-cur)}` : '数据不足'}</div>
      </div>
      <div class="price-card">
        <div class="label">价格波动</div>
        <div class="value" style="color:#4f46e5">${hasEnough ? fmt(hi-lo) : '—'}</div>
        <div class="sub">${hasEnough ? `振幅 ${amp.toFixed(1)}%` : '需更多数据'}</div>
      </div>
    </div>

    ${count >= 1 ? `
    <div class="chart-box">
      <h2>📊 ${cfg.name} · 价格走势（${count}条真实记录）</h2>
      <div class="chart-wrap"><canvas id="priceChart"></canvas></div>
    </div>` : ''}

    ${count >= 1 ? `
    <div class="table-box">
      <h2>📋 价格明细</h2>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>日期</th><th>价格</th><th>变化</th></tr></thead>
        <tbody>${history.slice().reverse().map((x,i,a)=>{
          const prev=a[i+1]; let ch='-';
          if(prev){const d=x.price-prev.price;
            if(d!==0)ch=`<span class="tag ${d<0?'down':'up'}">${d>0?'+':''}${fmt(Math.abs(d))}</span>`;
            else ch='<span style="color:#999">持平</span>';}
          return `<tr><td style="color:#999">${x.date||(x.recorded_at||'').split('T')[0]}</td><td class="price-cell">${fmt(x.price)}</td><td>${ch}</td></tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>` : ''}
  `;

  if (count >= 2) drawLineChart(history);
  else if (count === 1) drawSinglePoint(history[0]);
}

let chart = null;
function drawLineChart(history) {
  const ctx = document.getElementById('priceChart');
  if (!ctx) return;
  if (chart) chart.destroy();
  const prices = history.map(h=>h.price);
  const lo = Math.min(...prices), hi = Math.max(...prices);
  chart = new Chart(ctx, {
    type:'line',
    data:{
      labels: history.map(h => (h.date||h.recorded_at||'').slice(5)),
      datasets:[{
        data: prices,
        borderColor:'#4f46e5', backgroundColor:'rgba(79,70,229,0.06)',
        borderWidth:2.5, fill:true, tension:0.3,
        pointRadius: prices.map(p => p===lo||p===hi?5:2),
        pointBackgroundColor: prices.map(p => p===lo?'#2e7d32':p===hi?'#e53935':'#4f46e5'),
        pointHoverRadius:6,
      }],
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{
          title: items => history[items[0].dataIndex].date || history[items[0].dataIndex].recorded_at?.split('T')[0],
          label: ctx => '$' + ctx.parsed.y.toFixed(2),
        }},
      },
      scales:{
        x:{ grid:{display:false}, ticks:{maxTicksLimit:15, font:{size:10}, color:'#999'} },
        y:{ grid:{color:'#f0f0f0'}, ticks:{font:{size:10}, color:'#999', callback:v=>'$'+v} },
      },
    },
  });
}

function drawSinglePoint(pt) {
  const ctx = document.getElementById('priceChart');
  if (!ctx) return;
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type:'scatter',
    data:{ datasets:[{ data:[{x:(pt.date||pt.recorded_at||'').slice(5),y:pt.price}], backgroundColor:'#4f46e5', pointRadius:10, pointHoverRadius:14 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>'$'+ctx.parsed.y.toFixed(2)}},
      },
      scales:{
        x:{ grid:{display:false},ticks:{font:{size:10},color:'#999'} },
        y:{ grid:{color:'#f0f0f0'},ticks:{font:{size:10},color:'#999',callback:v=>'$'+v} },
      },
    },
  });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = (s||'').toString();
  return d.innerHTML;
}

function showMsg(icon, title, sub) {
  document.getElementById('content').innerHTML = `
    <div class="state-box"><div class="icon">${icon}</div><p>${title}</p>${sub?`<p class="sub">${sub}</p>`:''}</div>`;
}

// ═══════════════════════════════════════
// 入口
// ═══════════════════════════════════════
(function main() {
  const params = new URLSearchParams(window.location.search);
  const productUrl = params.get('url');
  const source     = params.get('source');    // 'client' = 从页面提取
  const title      = params.get('title');
  const price      = params.get('price');
  const image      = params.get('image');
  const shop       = params.get('shop');
  const platform   = params.get('platform') || detectPlatform(productUrl || '');

  if (!productUrl) {
    showMsg('🔗', '此页面需通过商品链接访问', '在 Amazon 商品页面点击「📉 查看价格走势」按钮');
    return;
  }

  if (!platform) {
    showMsg('⚠️', '未能识别该链接对应的平台', '当前仅支持 Amazon');
    return;
  }

  // 若有客户端提取的价格，自动存入历史
  if (source === 'client' && price && parseFloat(price) > 0) {
    const now = new Date().toISOString();
    const history = saveHistoryPoint(productUrl, parseFloat(price), now);
    render(platform, productUrl, title || '商品', price, image, shop, history);
    return;
  }

  // 无客户端数据 — 从本地存储读历史
  const history = getStoredHistory(productUrl);
  if (history.length > 0 && price) {
    saveHistoryPoint(productUrl, parseFloat(price));
    history.push({ date: new Date().toISOString().split('T')[0], price: parseFloat(price), recorded_at: new Date().toISOString() });
    render(platform, productUrl, title || '商品', price, image, shop, history);
  } else if (price && parseFloat(price) > 0) {
    const h = saveHistoryPoint(productUrl, parseFloat(price));
    render(platform, productUrl, title || '商品', price, image, shop, h);
  } else {
    showMsg('⚠️', '暂无价格数据', '未能从页面提取价格信息。请确保在商品详情页使用此工具。');
  }
})();
</script>
</body>
</html>
